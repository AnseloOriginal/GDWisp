name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: myapp-windows
          - os: ubuntu-latest
            artifact_name: myapp-linux
          - os: macos-latest
            artifact_name: myapp-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: bash

      - name: Build with PyInstaller
        run: |
          pyinstaller --name=${{ matrix.artifact_name }} app.spec
        shell: bash

      - name: Compress Build Output into Zip Archive
        run: |
          cd dist
          tar -a -c -f ${{ matrix.matrix.artifact_name }}.zip ${{ matrix.artifact_name }}
        shell: bash

      - name: Upload Zip Archive to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
